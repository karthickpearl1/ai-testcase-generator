# Baseline configuration. Paths are relative to this file.
name: baseline
project_key: BOOK  # used for the Xray / Zephyr exports

inputs:
  stories: examples/stories
  openapi: examples/openapi/bookshop.yaml

# The model that designs the tests. Override with TESTGEN_PROVIDER=openai|azure_openai|bedrock.
provider:
  name: mock
  model: mock-rules-v1

evaluation:
  execute_api_tests: true  # run the generated pytest suite against the demo API
  mutation_testing: true   # re-run it against each injected bug
  base_url: null           # set to run against your own deployment instead (no mutation)

gate:
  min:
    schema_validity: 0.95
    ac_coverage: 1.0
    endpoint_coverage: 1.0
    response_coverage: 0.85
    execution_pass_rate: 1.0
    mutation_score: 0.75
  max:
    rejected_cases: 0
